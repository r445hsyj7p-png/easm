# =============================================================================
# EASM MSSP Platform — docker-compose.yml
# Ein Befehl startet alles: docker compose up -d
#
# Services:
#   frontend        React SPA (Vite + Nginx)
#   api             FastAPI REST Backend
#   worker-scan     Celery: Scan-Pipeline (Subfinder/Naabu/HTTPX/Nuclei/Ramparts)
#   worker-hibp     Celery: HIBP Credential-Checks (rate-limited)
#   worker-alerts   Celery: Notifications + Report-Generierung
#   scheduler       Celery Beat: Zeitgesteuerte Scans
#   postgres        PostgreSQL 16 mit Row-Level Security
#   redis           Redis 7: Celery Broker + Cache
#   traefik         Reverse Proxy + automatisches TLS (Let's Encrypt)
#   flower          Celery Monitoring Dashboard
#   prometheus      Metriken-Sammlung
#   grafana         Metriken-Dashboards
# =============================================================================

x-env: &env
  DATABASE_URL: postgresql://${POSTGRES_USER:-easm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-easm}
  REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_neo4j}
  SECRET_KEY: ${SECRET_KEY:-please-set-a-real-secret-key-in-env}
  HIBP_API_KEY: ${HIBP_API_KEY:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  SHODAN_API_KEY: ${SHODAN_API_KEY:-}
  SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
  CENSYS_API_ID: ${CENSYS_API_ID:-}
  CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-4}
  NAABU_RATE: ${NAABU_RATE:-1000}
  HTTPX_SCREENSHOTS: ${HTTPX_SCREENSHOTS:-true}

x-common: &common
  restart: unless-stopped
  networks:
    - easm
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-worker-base: &worker-base
  build:
    context: ./backend
    dockerfile: ../docker/Dockerfile.worker
    args:
      CACHEBUST: "20260518-2"
  image: easm-worker:latest
  environment:
    <<: *env
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - screenshots:/app/screenshots
    - reports:/app/reports
    - nuclei_templates:/root/nuclei-templates
    - tool_tmp:/tmp/easm
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  <<: *common


services:

  # ── Reverse Proxy + TLS ────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--api.dashboard=false"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/certs
    networks:
      - easm
    restart: unless-stopped

  # ── Frontend (React SPA) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    image: easm-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    <<: *common

  # ── API (FastAPI) ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
      args:
        CACHEBUST: "20260518-2"
    image: easm-api:latest
    environment:
      <<: *env
      UVICORN_WORKERS: "4"
      LOG_LEVEL: "info"
    volumes:
      - reports:/app/reports
      - screenshots:/app/screenshots
      - user_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    <<: *common

  # ── Celery Worker: Scan-Pipeline ───────────────────────────────────────────
  worker-scan:
    <<: *worker-base
    command: >
      celery -A workers.toolchain_tasks worker
      --loglevel=info
      --concurrency=${SCAN_CONCURRENCY:-4}
      --queues=scans,http,vuln,mcp
      --hostname=scan@%h
    cap_add:
      - NET_RAW
      - NET_ADMIN
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ── Celery Worker: HIBP Credential-Checks ─────────────────────────────────
  worker-hibp:
    <<: *worker-base
    command: >
      celery -A workers.toolchain_tasks worker
      --loglevel=info
      --concurrency=2
      --queues=hibp
      --hostname=hibp@%h

  # ── Celery Worker: Alerts + Reports ───────────────────────────────────────
  worker-alerts:
    <<: *worker-base
    command: >
      celery -A workers.toolchain_tasks worker
      --loglevel=info
      --concurrency=4
      --queues=alerts,maintenance,reports
      --hostname=alerts@%h

  # ── Celery Beat Scheduler ─────────────────────────────────────────────────
  scheduler:
    <<: *worker-base
    command: celery -A workers.toolchain_tasks beat --loglevel=info
    volumes:
      - celery_beat:/app/celerybeat

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-easm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common

  # ── Flower (Celery Monitoring) ────────────────────────────────────────────
  flower:
    <<: *worker-base
    command: >
      celery -A workers.toolchain_tasks flower
      --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH:-admin:admin}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.rule=Host(`flower.${APP_DOMAIN}`)"
      - "traefik.http.routers.flower.entrypoints=websecure"
      - "traefik.http.routers.flower.tls.certresolver=letsencrypt"
      - "traefik.http.services.flower.loadbalancer.server.port=5555"

  # ── Backup (täglich 03:00 UTC) ────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: |
      sh -c 'while true; do
        sleep 86400
        pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/easm_$$(date +%Y%m%d_%H%M%S).sql.gz
        find /backups -name "*.sql.gz" -mtime +30 -delete
        echo "[backup] Backup completed: $$(date)"
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easm
    restart: unless-stopped


  # ── Neo4j Graph Database (Email Intelligence) ────────────────────────────
  neo4j:
    image: neo4j:5.16-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache__size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - easm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Worker: Email Intelligence (DNS-only, lightweight) ─────────────
  worker-email-intel:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.email-worker
    image: easm-email-worker:latest
    restart: unless-stopped
    command: >
      celery -A workers.email_intel_tasks worker
      --queues=email_intel
      --concurrency=2
      --loglevel=info
      --hostname=email-intel@%h
    environment:
      <<: *env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - easm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  easm:
    driver: bridge

volumes:
  user_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  reports:
    driver: local
  screenshots:
    driver: local
  nuclei_templates:
    driver: local
  tool_tmp:
    driver: local
  celery_beat:
    driver: local
  certs:
    driver: local
  backups:
    driver: local
    # stored at /var/lib/docker/volumes/easm_backups
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
